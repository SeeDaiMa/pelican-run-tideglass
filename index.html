<body>
  <header class="topbar wrap">
    <div class="brand" aria-label="Pelican Run 鹈鹕骑行"><canvas class="brand-mark" data-crest width="92" height="80" aria-hidden="true"></canvas><span>PELICAN<span class="brand-run">RUN</span></span></div>
    <nav class="nav" aria-label="主导航">
      <button class="nav-link active" id="rideTab" aria-current="page">骑行</button>
      <button class="nav-link" id="awardsOpen"><span>成就图鉴</span><span class="count" id="awardCount">0/14</span></button>
    </nav>
    <div class="toolbar">
      <button class="sound-button" id="soundBtn" aria-pressed="false" title="开启声音（M）"><i class="sound-bars" aria-hidden="true"><b></b><b></b><b></b><b></b></i><span id="soundLabel">声音关</span></button>
      <span class="toolbar-rule"></span>
      <button class="round-button" id="helpOpen" title="操作指南（H）" aria-label="操作指南"><canvas data-icon="help"></canvas></button>
      <button class="round-button pause-button" id="pauseBtn" title="暂停骑行（P）" aria-label="暂停骑行"><canvas data-icon="pause"></canvas></button>
    </div>
  </header>

  <main class="wrap">
    <section class="console" aria-label="飞鱼海岸骑行游戏">
      <div class="stage" id="stage">
        <canvas id="seaView" role="img" aria-label="实时三维海岸公路和骑自行车的鹈鹕"></canvas>
        <div class="scene-shade"></div>
        <div class="route-title"><div class="route-en"><i></i> FLYING FISH COAST</div><h1>飞鱼海岸</h1></div>
        <button class="sky-button glass" id="skyBtn" aria-label="跳至月夜" title="切换黄昏与月夜，随后继续自然循环"><canvas data-icon="sun"></canvas><span id="skyName">黄昏</span><b id="skyTime">18:20</b></button>
        <div class="pilot-hud"><div class="pilot-pill" id="pilotPill"><i></i><span id="pilotMode">自动追鱼</span></div><span id="pilotHint">按驾驶键接管</span></div>
        <div class="lens-control" aria-label="镜头切换"><button id="lensPrev" title="上一个镜头" aria-label="上一个镜头"><canvas data-icon="left"></canvas></button><button id="lensSelect" aria-haspopup="dialog" title="选择镜头（C 切换）"><canvas data-icon="camera"></canvas><span id="lensLabel">侧后跟拍</span><small id="lensIndex">1/5</small></button><button id="lensNext" title="下一个镜头（C）" aria-label="下一个镜头"><canvas data-icon="right"></canvas></button></div>
        <div id="notice" role="status" aria-live="polite"></div>
        <div class="scene-cover" id="loadCover"><div class="loader"></div><span id="loadingText">正在驶向海岸…</span></div>
        <div class="scene-cover paused" id="pauseCover" hidden><button id="resumeBtn"><canvas data-icon="play"></canvas><span>继续骑行</span></button></div>
      </div>

      <div class="telemetry" aria-label="实时骑行数据">
        <div class="readout speed-readout"><div class="readout-icon speed-icon"><canvas id="speedDial" aria-hidden="true"></canvas></div><div><div class="metric-label">当前时速</div><div class="metric-value"><strong id="speedValue">24</strong><small>KM/H</small></div></div></div>
        <div class="readout"><div class="readout-icon fish-icon"><canvas data-icon="fish"></canvas></div><div><div class="metric-label">已捕飞鱼</div><div class="metric-value"><strong id="fishValue">0</strong><small id="comboValue">尾</small></div></div></div>
        <div class="readout distance-readout"><div class="readout-icon"><canvas data-icon="route"></canvas></div><div><div class="metric-label">骑行里程</div><div class="metric-value"><strong id="distanceValue">0.00</strong><small>KM</small></div></div></div>
        <div class="radar-block"><div class="radar-caption"><span><i></i> 鱼群雷达</span><small id="targetDistance">前方 14 m</small></div><canvas id="radar" aria-label="三车道前方鱼群位置"></canvas></div>
      </div>
    </section>
    <div class="controls" aria-label="驾驶控制">
      <span class="control-intro"><canvas data-icon="pad"></canvas><span>驾驶操作</span></span>
      <div class="drive-buttons">
        <button data-drive="KeyW" title="按住 W 加速"><kbd>W</kbd><span>加速</span></button>
        <button data-drive="KeyS" title="按住 S 减速"><kbd>S</kbd><span>减速</span></button>
        <button data-drive="KeyA" title="A 向左变道"><kbd>A</kbd><span>左移</span></button>
        <button data-drive="KeyD" title="D 向右变道"><kbd>D</kbd><span>右移</span></button>
        <button data-drive="Space" title="空格跳跃"><kbd class="space-key">⌴</kbd><span>跳跃</span></button>
        <button data-drive="KeyT" title="按住 T 展翅抬前轮"><kbd>T</kbd><span>展翅</span></button>
      </div>
      <button id="expandBtn" class="expand" title="切换全屏（F）" aria-label="切换全屏"><canvas data-icon="expand"></canvas></button>
    </div>
  </main>

  <dialog id="panel"><div class="dialog-inner"><div class="dialog-heading"><div><div id="panelKicker" class="dialog-kicker"></div><h2 id="panelTitle"></h2></div><button class="round-button" id="panelClose" title="关闭（Esc）" aria-label="关闭"><canvas data-icon="close"></canvas></button></div><div id="panelContent"></div></div></dialog>
